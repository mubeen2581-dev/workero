version: '3.8'

services:
  workero-admin:
    image: nginx:alpine
    container_name: workero-admin
    ports:
      - "3000:80"
    volumes:
      - ./admin-dashboard:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  # Future: Backend API service
